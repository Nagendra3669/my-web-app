trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  imageName: my-web-app

steps:

- task: Docker@2
  displayName: Build Docker Image
  inputs:
    command: build
    Dockerfile: Dockerfile
    repository: nagendra3669/my-web-app
    tags: |
      $(Build.BuildId)

- task: Docker@2
  displayName: Push Docker Image
  inputs:
    containerRegistry: 'my-web-app'
    repository: 'nagendra3669/my-web-app'
    command: 'push'
    tags: '$(Build.BuildId)'
- task: AzureAppServiceSettings@1
  inputs:
    azureSubscription: 'Azure for Students(2)(942be285-0500-4001-91db-ee3c890e87aa)'
    appName: 'my-web-app'
    resourceGroupName: 'RG-AzureProject'