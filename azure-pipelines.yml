trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  imageName: my-web-app

steps:

- task: Docker@2
  displayName: Build Docker Image
  inputs:
    command: build
    Dockerfile: Dockerfile
    repository: nagendra3669/my-web-app
    tags: |
      $(Build.BuildId)

- task: Docker@2
  displayName: Push Docker Image
  inputs:
    command: push
    repository: nagendra3669/my-web-app
    tags: |
      $(Build.BuildId)